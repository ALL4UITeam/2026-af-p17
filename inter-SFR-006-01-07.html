<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
</head>
<body class="inter">
  <a href="#interMain" class="skip">본문 바로가기</a>

  <div class="brand_wrap">
    <div class="wrap-content wrap-content--bare" id="interMain">
      <div class="inner">
        {{> i-step}}

        <section class="i-panel" aria-labelledby="stepTitle">
          <header class="i-panel__head">
            <p class="i-panel__step">STEP {{currentStep}} / 10</p>
            <h2 id="stepTitle" class="i-panel__title">{{pageTitle}}</h2>
            <p class="i-panel__desc">단계를 작성 중입니다. 저장 후 지역협의회 구성, 운영으로 이동합니다.</p>
          </header>

          <div class="i-compose">
            <label class="i-compose__lab" for="cmYear">구성 :</label>
            <input type="text" id="cmYear" name="cmYear" class="form-control i-compose__input" title="구성 연도" value="21년도">
          </div>

          <!-- 위원 정보 -->
          <div class="i-block">
            <div class="tbl-col-wrap i-form">
              <table>
                <colgroup>
                  <col style="width: 180px">
                  <col>
                </colgroup>
                <tbody>
                  <tr>
                    <th scope="row"><label for="cmType">구분</label></th>
                    <td><input type="text" id="cmType" name="cmType" class="form-control i-form__full" title="구분"></td>
                  </tr>
                  <tr>
                    <th scope="row"><label for="cmName">위원명</label></th>
                    <td><input type="text" id="cmName" name="cmName" class="form-control i-form__full" title="위원명"></td>
                  </tr>
                  <tr>
                    <th scope="row"><label for="cmOrg">소속</label></th>
                    <td><input type="text" id="cmOrg" name="cmOrg" class="form-control i-form__full" title="소속"></td>
                  </tr>
                  <tr>
                    <th scope="row"><label for="cmPos">직위</label></th>
                    <td><input type="text" id="cmPos" name="cmPos" class="form-control i-form__full" title="직위"></td>
                  </tr>
                  <tr>
                    <th scope="row"><label for="cmTerm">임명기간</label></th>
                    <td><input type="text" id="cmTerm" name="cmTerm" class="form-control i-form__full" title="임명기간"></td>
                  </tr>
                  <tr>
                    <th scope="row"><label for="cmNote">비고</label></th>
                    <td><input type="text" id="cmNote" name="cmNote" class="form-control i-form__full" title="비고"></td>
                  </tr>
                </tbody>
              </table>
            </div>

            <div class="i-row-act">
              <button type="button" class="i-row-btn i-row-btn--add">+ 추가</button>
              <button type="button" class="i-row-btn i-row-btn--del">- 삭제</button>
            </div>
          </div>

          <!-- 운영현황 -->
          <div class="i-block">
            <h3 class="i-block__ti">■ 운영현황</h3>

            <div class="tbl-col-wrap i-form">
              <table>
                <colgroup>
                  <col style="width: 180px">
                  <col>
                </colgroup>
                <tbody>
                  <tr>
                    <th scope="row"><label for="opDate">개회시기</label></th>
                    <td><input type="text" id="opDate" name="opDate" class="form-control i-form__full" title="개회시기"></td>
                  </tr>
                  <tr>
                    <th scope="row"><label for="opAgenda">주요 안건</label></th>
                    <td><input type="text" id="opAgenda" name="opAgenda" class="form-control i-form__full" title="주요 안건"></td>
                  </tr>
                  <tr>
                    <th scope="row"><label for="opResult">주요 결과</label></th>
                    <td><input type="text" id="opResult" name="opResult" class="form-control i-form__full" title="주요 결과"></td>
                  </tr>
                  <tr>
                    <th scope="row"><label for="opNote">비고</label></th>
                    <td><input type="text" id="opNote" name="opNote" class="form-control i-form__full" title="비고"></td>
                  </tr>
                </tbody>
              </table>
            </div>

            <div class="i-row-act">
              <button type="button" class="i-row-btn i-row-btn--add">+ 추가</button>
              <button type="button" class="i-row-btn i-row-btn--del">- 삭제</button>
            </div>
          </div>

          <div class="i-panel__foot i-panel__foot--split">
            <div class="i-row-act i-row-act--foot">
              <button type="button" class="i-row-btn i-row-btn--add">+ 추가</button>
              <button type="button" class="i-row-btn i-row-btn--del">- 삭제</button>
            </div>
            <div class="i-panel__nav">
              <a href="./inter-SFR-006-01-06.html" class="i-btn i-btn--solid">이전</a>
              <button type="button" class="i-btn i-btn--ghost">임시저장</button>
              <a href="./inter-SFR-006-01-08.html" class="i-btn i-btn--primary">다음</a>
            </div>
          </div>
        </section>
      </div>
    </div>
  </div>

  <div id="liveStatus" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <script type="module" src="./src/js/inter.js"></script>
</body>
</html>
