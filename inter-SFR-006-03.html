<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <link rel="stylesheet" href="./src/scss/inter.scss">
  <link rel="stylesheet" href="./src/scss/inter-style.scss">
</head>
<body class="inter">
  <a href="#interMain" class="skip">본문 바로가기</a>

  <div class="brand_wrap">
    <div class="wrap-content wrap-content--bare" id="interMain">
      <div class="inner">
        {{!-- 01 기본정보: 고정 --}}
        {{> i-view-base}}

        {{!-- 02~10: 탭만 전환 --}}
        {{> i-view-tabs}}

        <div class="i-vtab__panels">
          <div class="i-vtab__panel is-on" id="vtab02" role="tabpanel" aria-labelledby="vtabBtn02">
            {{> i-view-02}}
          </div>

          <div class="i-vtab__panel" id="vtab03" role="tabpanel" aria-labelledby="vtabBtn03" hidden>
            {{> i-view-03}}
          </div>

          <div class="i-vtab__panel" id="vtab04" role="tabpanel" aria-labelledby="vtabBtn04" hidden>
            {{> i-view-04}}
          </div>

          <div class="i-vtab__panel" id="vtab05" role="tabpanel" aria-labelledby="vtabBtn05" hidden>
            {{> i-view-05}}
          </div>

          <div class="i-vtab__panel" id="vtab06" role="tabpanel" aria-labelledby="vtabBtn06" hidden>
            {{> i-view-06}}
          </div>

          <div class="i-vtab__panel" id="vtab07" role="tabpanel" aria-labelledby="vtabBtn07" hidden>
            {{> i-view-07}}
          </div>

          <div class="i-vtab__panel" id="vtab08" role="tabpanel" aria-labelledby="vtabBtn08" hidden>
            {{> i-view-08}}
          </div>

          <div class="i-vtab__panel" id="vtab09" role="tabpanel" aria-labelledby="vtabBtn09" hidden>
            {{> i-view-09}}
          </div>

          <div class="i-vtab__panel" id="vtab10" role="tabpanel" aria-labelledby="vtabBtn10" hidden>
            {{> i-view-10}}
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="liveStatus" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <script src="./vendor/jquery/jquery.js"></script>
  <script>
    $(function () {
      function openVtab(id) {
        $('.i-vtab__btn').removeClass('is-on').attr('aria-selected', 'false');
        $('.i-vtab__btn[data-vtab="' + id + '"]').addClass('is-on').attr('aria-selected', 'true');
        $('.i-vtab__panel').removeClass('is-on').prop('hidden', true);
        $('#' + id).addClass('is-on').prop('hidden', false);
      }

      $('.i-vtab__btn').on('click', function () {
        openVtab($(this).data('vtab'));
      });

      // ?tab=03 형태 지원
      var q = new URLSearchParams(location.search).get('tab');
      if (q) {
        var id = 'vtab' + String(q).padStart(2, '0');
        if ($('#' + id).length) openVtab(id);
      }
    });
  </script>
</body>
</html>
