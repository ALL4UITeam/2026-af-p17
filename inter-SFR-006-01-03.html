<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <link rel="stylesheet" href="./src/scss/inter.scss">
  <link rel="stylesheet" href="./src/scss/inter-style.scss">
</head>
<body class="inter">
  <a href="#interMain" class="skip">본문 바로가기</a>

  <div class="brand_wrap">
    <div class="wrap-content wrap-content--bare" id="interMain">
      <div class="inner">
        {{> i-step}}

        <section class="i-panel" aria-labelledby="stepTitle">
          <header class="i-panel__head">
            <p class="i-panel__step">STEP {{currentStep}} / 10</p>
            <h2 id="stepTitle" class="i-panel__title">{{pageTitle}}</h2>
            <p class="i-panel__desc">단계를 작성 중입니다. 저장 후 해양공간적합성협의 현황으로 이동합니다.</p>
          </header>

          <div class="i-guide" role="note">
            <strong class="i-guide__ti">작성방법</strong>
            <ul class="i-guide__list">
              <li>점검기간 중 발급·유효한 공유수면 점용·사용 허가 현황을 건별로 입력합니다.</li>
              <li>위치·면적·목적·설치 구조물을 명확히 기재하고, 여러 건인 경우 [+ 추가]로 행을 늘려 작성합니다.</li>
              <li>시작·종료일자와 해양용도구역, 공유수면 관리청을 확인한 뒤 저장합니다.</li>
            </ul>
          </div>

          <div class="i-form__toolbar">
            <button type="button" class="i-btn i-btn--solid i-btn--sm">불러오기</button>
          </div>

          <div class="tbl-col-wrap i-form">
            <table>
              <colgroup>
                <col style="width: 180px">
                <col>
                <col style="width: 140px">
                <col>
              </colgroup>
              <tbody>
                <tr>
                  <th scope="row"><label for="occType">구분</label></th>
                  <td colspan="3"><input type="text" id="occType" name="occType" class="form-control i-form__full" title="구분"></td>
                </tr>
                <tr>
                  <th scope="row"><label for="permitNo">허가번호</label></th>
                  <td colspan="3"><input type="text" id="permitNo" name="permitNo" class="form-control i-form__full" title="허가번호"></td>
                </tr>
                <tr>
                  <th scope="row"><label for="occLoc">위치</label></th>
                  <td colspan="3"><input type="text" id="occLoc" name="occLoc" class="form-control i-form__full" title="위치"></td>
                </tr>
                <tr>
                  <th scope="row"><label for="occArea">면적 (m2)</label></th>
                  <td colspan="3"><input type="text" id="occArea" name="occArea" class="form-control i-form__full" title="면적 (m2)"></td>
                </tr>
                <tr>
                  <th scope="row"><label for="occPurpose">목적</label></th>
                  <td colspan="3"><input type="text" id="occPurpose" name="occPurpose" class="form-control i-form__full" title="목적"></td>
                </tr>
                <tr>
                  <th scope="row"><label for="occStructure">설치 구조물</label></th>
                  <td colspan="3"><input type="text" id="occStructure" name="occStructure" class="form-control i-form__full" title="설치 구조물"></td>
                </tr>
                <tr>
                  <th scope="row"><label for="startDate">시작일자</label></th>
                  <td>
                    <div class="i-form__date">
                      <input type="text" id="startDate" name="startDate" class="form-control datepicker" title="시작일자" readonly>
                      <button type="button" class="i-form__cal" aria-label="시작일자 달력 열기">
                        <span class="i-form__cal-ico" aria-hidden="true"></span>
                      </button>
                    </div>
                  </td>
                  <th scope="row"><label for="endDate">종료일자</label></th>
                  <td>
                    <div class="i-form__date">
                      <input type="text" id="endDate" name="endDate" class="form-control datepicker" title="종료일자" readonly>
                      <button type="button" class="i-form__cal" aria-label="종료일자 달력 열기">
                        <span class="i-form__cal-ico" aria-hidden="true"></span>
                      </button>
                    </div>
                  </td>
                </tr>
                <tr>
                  <th scope="row"><label for="occZone">해양용도구역</label></th>
                  <td colspan="3"><input type="text" id="occZone" name="occZone" class="form-control i-form__full" title="해양용도구역"></td>
                </tr>
                <tr>
                  <th scope="row"><label for="occOffice">공유수면 관리청</label></th>
                  <td colspan="3"><input type="text" id="occOffice" name="occOffice" class="form-control i-form__full" title="공유수면 관리청"></td>
                </tr>
                <tr>
                  <th scope="row"><label for="occNote">비고</label></th>
                  <td colspan="3"><input type="text" id="occNote" name="occNote" class="form-control i-form__full" title="비고"></td>
                </tr>
              </tbody>
            </table>
          </div>

          <div class="i-row-act">
            <button type="button" class="i-row-btn i-row-btn--add">+ 추가</button>
            <button type="button" class="i-row-btn i-row-btn--del">- 삭제</button>
          </div>

          <footer class="i-panel__foot">
            <a href="./inter-SFR-006-01-02.html" class="i-btn i-btn--solid">이전</a>
            <button type="button" class="i-btn i-btn--ghost">임시저장</button>
            <a href="./inter-SFR-006-01-04.html" class="i-btn i-btn--primary">다음</a>
          </footer>
        </section>
      </div>
    </div>
  </div>

  <div id="liveStatus" class="sr-only" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
