<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
</head>
<body class="inter">
  <a href="#interMain" class="skip">본문 바로가기</a>

  <div class="brand_wrap">
    <div class="wrap-content wrap-content--bare" id="interMain">
      <div class="inner">
        {{> i-step}}

        <section class="i-panel" aria-labelledby="stepTitle">
          <header class="i-panel__head">
            <p class="i-panel__step">STEP {{currentStep}} / 10</p>
            <h2 id="stepTitle" class="i-panel__title">{{pageTitle}}</h2>
            <p class="i-panel__desc">단계를 작성 중입니다. 저장 후 이행점검 결과를 제출합니다.</p>
          </header>

          <div class="i-guide" role="note">
            <strong class="i-guide__ti">작성방법</strong>
            <ul class="i-guide__list">
              <li>단일 이용 및 개발사업에 따른 지정 및 변경이 내용적으로 구분되는 경우는 구분되는 단위별(0-0)로 모두 작성합니다.</li>
              <li>타 법에 근거한 권리의 기간 만료(예. 골재채취단지 및 골재채취예정지 기간종료)에 따라 용도구역을 해제하여 해당 해양용도구역을 미지정으로 변경할 예정인 경우에도 해당 정보를 기입합니다.</li>
            </ul>
          </div>

          <div class="tbl-col-wrap i-form">
            <table>
              <colgroup>
                <col style="width: 160px">
                <col>
              </colgroup>
              <tbody>
                <tr>
                  <th scope="row"><label for="ntfcNo">고시번호</label></th>
                  <td><input type="text" id="ntfcNo" name="ntfcNo" class="form-control i-form__full" title="고시번호"></td>
                </tr>
                <tr>
                  <th scope="row">위치·면적</th>
                  <td>
                    <div class="i-zone">
                      <div class="i-zone__box">
                        <div class="i-zone__row">
                          <span class="i-zone__lab">위치</span>
                          <label class="i-loc__lab" for="znLat">위도</label>
                          <input type="text" id="znLat" name="znLat" class="form-control" title="위도">
                          <label class="i-loc__lab" for="znLng">경도</label>
                          <input type="text" id="znLng" name="znLng" class="form-control" title="경도">
                        </div>
                        <div class="i-zone__row">
                          <label class="i-zone__lab" for="znArea">면적</label>
                          <input type="text" id="znArea" name="znArea" class="form-control i-form__full" title="면적">
                        </div>
                        <div class="i-zone__row i-zone__row--top">
                          <label class="i-zone__lab" for="znChange">변경내용</label>
                          <textarea id="znChange" name="znChange" class="form-control i-form__textarea" title="변경내용" rows="4"></textarea>
                        </div>
                        <button type="button" class="i-chip-btn i-chip-btn--add">+ 추가</button>
                      </div>
                    </div>
                  </td>
                </tr>
                <tr>
                  <th scope="row"><label for="znReason">변경사유</label></th>
                  <td><input type="text" id="znReason" name="znReason" class="form-control i-form__full" title="변경사유"></td>
                </tr>
                <tr>
                  <th scope="row"><label for="ntfcDate">고시일</label></th>
                  <td>
                    <div class="i-form__date">
                      <input type="text" id="ntfcDate" name="ntfcDate" class="form-control datepicker" title="고시일" readonly>
                      <button type="button" class="i-form__cal" aria-label="고시일 달력 열기">
                        <span class="i-form__cal-ico" aria-hidden="true"></span>
                      </button>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>

          <div class="i-row-act">
            <button type="button" class="i-row-btn i-row-btn--add">+ 추가</button>
            <button type="button" class="i-row-btn i-row-btn--del">- 삭제</button>
          </div>

          <footer class="i-panel__foot">
            <a href="./inter-SFR-006-01-09.html" class="i-btn i-btn--solid">이전</a>
            <button type="button" class="i-btn i-btn--ghost">임시저장</button>
            <button type="button" class="i-btn i-btn--primary">등록</button>
          </footer>
        </section>
      </div>
    </div>
  </div>

  <div id="liveStatus" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <script type="module" src="./src/js/inter.js"></script>
</body>
</html>
