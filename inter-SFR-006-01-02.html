<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
</head>
<body class="inter">
  <a href="#interMain" class="skip">본문 바로가기</a>

  <div class="brand_wrap">
    <div class="wrap-content wrap-content--bare" id="interMain">
      <div class="inner">
        {{> i-step}}

        <section class="i-panel" aria-labelledby="stepTitle">
          <header class="i-panel__head">
            <p class="i-panel__step">STEP {{currentStep}} / 10</p>
            <h2 id="stepTitle" class="i-panel__title">{{pageTitle}}</h2>
            <p class="i-panel__desc">해당 단계를 작성 중이며, 저장 시 다음 단계로 이동합니다.</p>
          </header>

          <div class="i-guide" role="note">
            <strong class="i-guide__ti">작성방법</strong>
            <ul class="i-guide__list">
              <li>공유수면 매립면허 현황을 건별로 입력합니다. 여러 건인 경우 [+ 추가]로 행을 늘려 작성합니다.</li>
              <li>기존에 등록된 항목이 있으면 내용을 확인·수정한 뒤 저장합니다.</li>
              <li>위치(전면해상)·해양용도구역·진행현황(공사중, 준공 등)을 정확히 기재합니다.</li>
            </ul>
          </div>

          <div class="tbl-col-wrap i-form">
            <table>
              <colgroup>
                <col style="width: 220px">
                <col>
              </colgroup>
              <tbody>
                <tr>
                  <th scope="row"><label for="localGov">기초지자체</label></th>
                  <td><input type="text" id="localGov" name="localGov" class="form-control i-form__full" title="기초지자체"></td>
                </tr>
                <tr>
                  <th scope="row"><label for="licenseNo">면허번호 (발급일자)</label></th>
                  <td><input type="text" id="licenseNo" name="licenseNo" class="form-control i-form__full" title="면허번호 (발급일자)"></td>
                </tr>
                <tr>
                  <th scope="row"><label for="reclaimName">매립명/매립목적</label></th>
                  <td><input type="text" id="reclaimName" name="reclaimName" class="form-control i-form__full" title="매립명/매립목적"></td>
                </tr>
                <tr>
                  <th scope="row"><label for="location">위치 (전면해상)</label></th>
                  <td><input type="text" id="location" name="location" class="form-control i-form__full" title="위치 (전면해상)"></td>
                </tr>
                <tr>
                  <th scope="row"><label for="useZone">해양용도구역</label></th>
                  <td><input type="text" id="useZone" name="useZone" class="form-control i-form__full" title="해양용도구역"></td>
                </tr>
                <tr>
                  <th scope="row"><label for="licenseOffice">매립면허관청</label></th>
                  <td><input type="text" id="licenseOffice" name="licenseOffice" class="form-control i-form__full" title="매립면허관청"></td>
                </tr>
                <tr>
                  <th scope="row"><label for="reclaimEntity">매립주체</label></th>
                  <td><input type="text" id="reclaimEntity" name="reclaimEntity" class="form-control i-form__full" title="매립주체"></td>
                </tr>
                <tr>
                  <th scope="row"><label for="planReflect">매립기본계획 반영여부</label></th>
                  <td><input type="text" id="planReflect" name="planReflect" class="form-control i-form__full" title="매립기본계획 반영여부"></td>
                </tr>
                <tr>
                  <th scope="row"><label for="reclaimSize">매립규모 (m2)</label></th>
                  <td><input type="text" id="reclaimSize" name="reclaimSize" class="form-control i-form__full" title="매립규모 (m2)"></td>
                </tr>
                <tr>
                  <th scope="row"><label for="progress">진행현황</label></th>
                  <td><input type="text" id="progress" name="progress" class="form-control i-form__full" title="진행현황"></td>
                </tr>
              </tbody>
            </table>
          </div>

          <div class="i-row-act">
            <button type="button" class="i-row-btn i-row-btn--add">+ 추가</button>
            <button type="button" class="i-row-btn i-row-btn--del">- 삭제</button>
          </div>

          <footer class="i-panel__foot">
            <a href="./inter-SFR-006-01-01.html" class="i-btn i-btn--solid">이전</a>
            <button type="button" class="i-btn i-btn--ghost">임시저장</button>
            <a href="./inter-SFR-006-01-03.html" class="i-btn i-btn--primary">다음</a>
          </footer>
        </section>
      </div>
    </div>
  </div>

  <div id="liveStatus" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <script type="module" src="./src/js/inter.js"></script>
</body>
</html>
