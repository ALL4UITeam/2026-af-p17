<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
</head>
<body>
  <a href="#mainMap" class="skip">본문 바로가기</a>

  <div class="app" id="app">
    <div class="shell">
      {{> hdr}}
      <div class="shell-body">
        {{> lnb}}
        {{> panel}}
        {{> tour}}
      </div>
    </div>
    {{> detail}}
    <main class="stage" id="mainMap" tabindex="-1" aria-label="지도 영역">
      <h1 class="sr-only">통합 해양공간 GIS 플랫폼 지도</h1>
      <img class="stage__map" src="./src/assets/img/map-view.png" alt="해양공간 지도 화면">
      {{> quick}}
      {{> tools}}
      <button type="button" class="handle" id="panelHandle" aria-label="패널 접기" aria-controls="searchPanel tourPanel">
        <img src="./src/assets/tool/handle.svg" alt="" aria-hidden="true">
      </button>
    </main>
  </div>
  <div id="liveStatus" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <script type="module" src="./src/js/map.js"></script>
</body>
</html>
