<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <link rel="stylesheet" href="./src/scss/inter.scss">
  <link rel="stylesheet" href="./src/scss/inter-style.scss">
</head>
<body class="inter">
  <a href="#interMain" class="skip">본문 바로가기</a>

  <div class="brand_wrap">
    <div class="wrap-content wrap-content--bare" id="interMain">
      <div class="inner">
        {{> i-step}}

        <section class="i-panel" aria-labelledby="stepTitle">
          <header class="i-panel__head">
            <p class="i-panel__step">STEP {{currentStep}} / 10</p>
            <h2 id="stepTitle" class="i-panel__title">{{pageTitle}}</h2>
            <p class="i-panel__desc">단계를 작성 중입니다. 저장 후 지역역량 강화로 이동합니다.</p>
            <p class="i-panel__note">※ '19년 한시적 운영 후 미구성</p>
          </header>

          <div class="i-block">
            <h3 class="i-block__ti">■ 구성</h3>

            <div class="tbl-col-wrap i-form">
              <table>
                <colgroup>
                  <col style="width: 200px">
                  <col>
                </colgroup>
                <tbody>
                  <tr>
                    <th scope="row"><label for="cnName">위원명</label></th>
                    <td><input type="text" id="cnName" name="cnName" class="form-control i-form__full" title="위원명"></td>
                  </tr>
                  <tr>
                    <th scope="row"><label for="cnOrg">소속 / 직업</label></th>
                    <td><input type="text" id="cnOrg" name="cnOrg" class="form-control i-form__full" title="소속 / 직업"></td>
                  </tr>
                  <tr>
                    <th scope="row"><label for="cnPos">직위</label></th>
                    <td><input type="text" id="cnPos" name="cnPos" class="form-control i-form__full" title="직위"></td>
                  </tr>
                  <tr>
                    <th scope="row"><label for="cnTerm">임명기간</label></th>
                    <td><input type="text" id="cnTerm" name="cnTerm" class="form-control i-form__full" title="임명기간"></td>
                  </tr>
                  <tr>
                    <th scope="row"><label for="cnNote">비고</label></th>
                    <td><input type="text" id="cnNote" name="cnNote" class="form-control i-form__full" title="비고"></td>
                  </tr>
                </tbody>
              </table>
            </div>

            <div class="i-row-act">
              <button type="button" class="i-row-btn i-row-btn--add">+ 추가</button>
              <button type="button" class="i-row-btn i-row-btn--del">- 삭제</button>
            </div>
          </div>

          <div class="i-block">
            <h3 class="i-block__ti">■ 운영현황</h3>

            <div class="tbl-col-wrap i-form">
              <table>
                <colgroup>
                  <col style="width: 200px">
                  <col>
                </colgroup>
                <tbody>
                  <tr>
                    <th scope="row"><label for="opWhen">개최 시기</label></th>
                    <td><input type="text" id="opWhen" name="opWhen" class="form-control i-form__full" title="개최 시기"></td>
                  </tr>
                  <tr>
                    <th scope="row"><label for="opAgenda">주요 안건</label></th>
                    <td><input type="text" id="opAgenda" name="opAgenda" class="form-control i-form__full" title="주요 안건"></td>
                  </tr>
                  <tr>
                    <th scope="row"><label for="opResult">주요 결과</label></th>
                    <td><input type="text" id="opResult" name="opResult" class="form-control i-form__full" title="주요 결과"></td>
                  </tr>
                  <tr>
                    <th scope="row"><label for="opNote">비고</label></th>
                    <td><input type="text" id="opNote" name="opNote" class="form-control i-form__full" title="비고"></td>
                  </tr>
                </tbody>
              </table>
            </div>

            <div class="i-row-act">
              <button type="button" class="i-row-btn i-row-btn--add">+ 추가</button>
              <button type="button" class="i-row-btn i-row-btn--del">- 삭제</button>
            </div>
          </div>

          <footer class="i-panel__foot">
            <a href="./inter-SFR-006-01-07.html" class="i-btn i-btn--solid">이전</a>
            <button type="button" class="i-btn i-btn--ghost">임시저장</button>
            <a href="./inter-SFR-006-01-09.html" class="i-btn i-btn--primary">다음</a>
          </footer>
        </section>
      </div>
    </div>
  </div>

  <div id="liveStatus" class="sr-only" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
